<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#282c34"/>
      <stop offset="100%" style="stop-color:#21252b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- Gauge arc -->
  <circle cx="256" cy="280" r="150" fill="none" stroke="#3e4451" stroke-width="20" stroke-dasharray="471 471" stroke-dashoffset="-118" transform="rotate(135 256 280)"/>
  <!-- Speed zones -->
  <circle cx="256" cy="280" r="130" fill="none" stroke="#98c379" stroke-width="6" stroke-dasharray="141 471" stroke-dashoffset="-118" transform="rotate(135 256 280)" opacity="0.5"/>
  <circle cx="256" cy="280" r="130" fill="none" stroke="#e5c07b" stroke-width="6" stroke-dasharray="141 471" stroke-dashoffset="-259" transform="rotate(135 256 280)" opacity="0.5"/>
  <circle cx="256" cy="280" r="130" fill="none" stroke="#e06c75" stroke-width="6" stroke-dasharray="188 471" stroke-dashoffset="-400" transform="rotate(135 256 280)" opacity="0.5"/>
  <!-- Needle -->
  <path d="M256 280 L256 160 L260 280 L252 280 Z" fill="#abb2bf" transform="rotate(-45 256 280)"/>
  <!-- Center cap -->
  <circle cx="256" cy="280" r="15" fill="#61afef"/>
  <!-- Text -->
  <text x="256" y="340" font-family="sans-serif" font-size="48" font-weight="bold" fill="#d7dae0" text-anchor="middle">60</text>
  <text x="256" y="370" font-family="sans-serif" font-size="14" fill="#7f848e" text-anchor="middle">km/h</text>
</svg>
